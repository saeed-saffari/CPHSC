<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team circle builder</title>
<style>
:root{--ink:#1d2b28;--muted:#5d6b67;--acc:#2f6b5e;--line:#d8dfda;--bg:#f5f7f5}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito Sans","Helvetica Neue",Arial,sans-serif;font-weight:500;color:var(--ink);background:var(--bg);line-height:1.45}
h1{font-size:1.4rem;margin:0;font-weight:700}
header{max-width:1280px;margin:0 auto;padding:22px 24px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.hb{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover:not(:disabled){color:#fff;opacity:.9}
button.danger:hover{border-color:#b3261e;color:#b3261e}
.app{max-width:1280px;margin:0 auto;padding:20px 24px 40px;display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:24px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
ul{list-style:none;margin:0 0 18px;padding:0}
li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
li.empty{color:var(--muted);font-size:.85rem}
.th{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:120px}.who b{display:block;font-weight:700}.who small{color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.82rem;margin:0 0 6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.tabs .sp{flex:1}.tabs small{color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:8px 12px;background:var(--bg);border-radius:8px}
.tools label{margin:0;display:flex;gap:8px;align-items:center;font-size:.82rem;font-weight:700}
.tools input{width:130px}.tools small{flex-basis:100%;color:#9a5b00;min-height:1em}.tools b{min-width:42px;font-weight:700;color:var(--acc)}
@media(min-width:901px){.app>section:nth-child(2){position:sticky;top:12px}}
iframe{width:100%;height:clamp(440px,calc(100vh - 210px),780px);border:1px solid var(--line);border-radius:8px;background:#fff}
#code{width:100%;height:600px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.off{display:none}
dialog{border:none;border-radius:14px;padding:22px;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 4px;font-size:1.15rem}
label{display:block;font-size:.8rem;font-weight:700;margin:12px 0 4px}
input[type=text],textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
canvas{width:130px;height:130px;border-radius:50%;border:1px solid var(--line);flex:none}
input[type=range]{accent-color:var(--acc)}
.sl{flex:1;min-width:180px}.sl label{margin:4px 0 0;font-weight:500}.sl input{width:100%}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
details{margin-top:6px}summary{cursor:pointer;font-weight:700;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div><h1>Team circle builder</h1><p>Edit the people, check the preview, then copy the HTML code into the website.</p></div>
  <div class="hb">
    <button id="exp" title="Download a roster.json backup of everyone, including archived people">Export roster.json</button>
    <button id="imp">Import roster.json</button>
    <button id="repo" title="Load roster.json saved next to this page (e.g. in your GitHub repository)">Load from repository</button>
    <input type="file" id="impf" accept=".json,application/json" class="off">
  </div>
</header>
<main class="app">
  <section class="card">
    <div class="bar"><b>In the circle (<span id="nA"></span>)</b><button class="pri" id="add">+ Add person</button></div>
    <ul id="listA"></ul>
    <div class="bar"><b>Archived (<span id="nR"></span>)</b></div>
    <p class="note">Removed from the circle but kept here. Restore them any time, or delete permanently.</p>
    <ul id="listR"></ul>
    <details><summary>Text in the middle of the table</summary>
      <label for="cT">Title</label><input type="text" id="cT">
      <label for="cS">Line under it</label><input type="text" id="cS">
    </details>
  </section>
  <section class="card">
    <div class="tabs">
      <button data-tab="prev" class="on">Preview</button><button data-tab="code">HTML code</button>
      <span class="sp"></span><small id="size"></small><button class="pri off" id="copy">Copy code</button>
    </div>
    <div class="tools">
      <label>Table size <input type="range" id="sT" min="40" max="85" step="1"> <b id="vT"></b></label>
      <label>Photo size <input type="range" id="sP" min="8" max="26" step="0.5"> <b id="vP"></b></label>
      <label>Circle width on the site <input type="range" id="sW" min="500" max="1100" step="10"> <b id="vW"></b></label>
      <button id="rst" type="button">Reset sizes</button>
      <small id="hint"></small>
    </div>
    <iframe id="frame" sandbox="allow-scripts" title="Preview"></iframe>
    <textarea id="code" class="off" readonly spellcheck="false"></textarea>
  </section>
</main>
<dialog id="dlg">
  <h2 id="dT">Person</h2>
  <label for="f_n">Name *</label><input type="text" id="f_n">
  <div class="two"><div><label for="f_r">Title</label><input type="text" id="f_r" placeholder="e.g. Research Fellow"></div>
  <div><label for="f_c">Sub-title</label><input type="text" id="f_c" placeholder="e.g. PhD"></div></div>
  <div class="two"><div><label for="f_p">Pronouns (optional)</label><input type="text" id="f_p" placeholder="e.g. she/her/hers"></div>
  <div><label for="f_k">Label above description (optional)</label><input type="text" id="f_k" placeholder="Focus or Affiliation"></div></div>
  <label for="f_d">Description</label><textarea id="f_d" rows="3"></textarea>
  <label for="f_l">Profile link (optional)</label><input type="text" id="f_l" placeholder="https://...">
  <label>Photo</label>
  <div class="ph"><canvas id="cv" width="220" height="220"></canvas>
    <div class="sl"><input type="file" id="file" accept="image/*">
      <label for="zoom">Zoom</label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
      <label for="px">Left / right</label><input type="range" id="px" min="0" max="1" step="0.01" value="0.5">
      <label for="py">Up / down</label><input type="range" id="py" min="0" max="1" step="0.01" value="0.35">
      <button id="rmph" type="button">Remove photo</button></div></div>
  <div class="act"><button id="cancel">Cancel</button><button class="pri" id="ok">Save</button></div>
</dialog>
<div id="toast"></div>

$("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="roster.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function apply(d,from){
  const list=Array.isArray(d)?d:d&&d.members;if(!Array.isArray(list)){toast("That file is not a team roster.");return}
  if(!confirm("Replace the current list ("+D.members.length+" people) with "+list.length+" people from "+from+"?"))return;
  D={settings:(d&&d.settings)||D.settings,members:list.map((m,i)=>({id:m.id||"m"+Date.now().toString(36)+i,n:m.n||"",r:m.r||"",c:m.c||"",p:m.p||"",k:m.k||"",d:m.d||"",link:m.link||"",photo:m.photo||"",on:m.on!==false}))};
  $("#cT").value=D.settings.title||"";$("#cS").value=D.settings.sub||"";sizes();save();toast("Roster loaded");
}
$("#imp").onclick=()=>$("#impf").click();
$("#impf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{apply(JSON.parse(r.result),f.name)}catch(x){toast("Could not read that file.")}};r.readAsText(f);e.target.value=""};
$("#repo").onclick=()=>fetch("roster.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>apply(d,"roster.json")).catch(()=>toast("No roster.json found next to this page."));
D.settings=D.settings||clone(SEED.settings);
function sizes(){const s=D.settings;s.table=+s.table||66;s.photo=+s.photo||15;s.width=+s.width||760;$("#sT").value=s.table;$("#sP").value=s.photo;$("#sW").value=s.width;$("#vT").textContent=s.table+"%";$("#vP").textContent=s.photo+"%";$("#vW").textContent=s.width+" px";hint()}
function hint(){const s=D.settings,N=D.members.filter(m=>m.on).length,P=s.photo,R=Math.min(s.table/2+P/2+.75,49.5-P/2),Te=Math.min(s.table,2*(R-P/2-.75)),m=[];if(Te<s.table-.05)m.push("Table limited to "+Math.round(Te)+"% so the photos fit inside the circle.");if(N>1&&2*Math.PI*R/N<P-.05)m.push("Photos overlap at this size. Make the table bigger or the photos smaller.");$("#hint").textContent=m.join(" ")}
sizes();
$("#sT").oninput=()=>{D.settings.table=+$("#sT").value;sizes();save()};
$("#sP").oninput=()=>{D.settings.photo=+$("#sP").value;sizes();save()};
$("#sW").oninput=()=>{D.settings.width=+$("#sW").value;sizes();save()};
$("#rst").onclick=()=>{D.settings.table=66;D.settings.photo=15;D.settings.width=760;sizes();save()};
$("#cT").value=D.settings.title||"";$("#cS").value=D.settings.sub||"";
$("#cT").oninput=()=>{D.settings.title=$("#cT").value;save()};
$("#cS").oninput=()=>{D.settings.sub=$("#cS").value;save()};
render();
</script>
</body>
</html>
