<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NS Civic Address Finder</title>
  
  <!-- NEW: Turf.js library for spatial math (Point-in-Polygon) in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f2;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 1rem;
    }

    .source-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #555;
      margin-bottom: 1.25rem;
    }

    /* ── Search box ── */
    .search-wrap {
      position: relative;
    }

    #q {
      width: 100%;
      padding: 12px 44px 12px 16px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #q:focus {
      border-color: #378ADD;
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.18);
    }

    /* Spinner */
    .spinner {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #ddd;
      border-top-color: #378ADD;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* ── Dropdown ── */
    #dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 1000;
      background: #ffffff;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      display: none;
      max-height: 340px;
      overflow-y: auto;
    }

    .dd-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #ffffff;
    }
    .dd-item:last-child { border-bottom: none; }
    .dd-item:hover,
    .dd-item.active { background: #f0f6fd; }

    .dd-icon {
      color: #378ADD;
      font-size: 16px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .dd-main { font-weight: 600; color: #1a1a1a; }
    .dd-sub  { font-size: 12px; color: #777; margin-top: 2px; }

    .dd-message {
      padding: 16px;
      font-size: 14px;
      color: #888;
      text-align: center;
      background: #ffffff;
    }

    /* ── Result card ── */
    #result-card {
      display: none;
      margin-top: 1.25rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 1.25rem;
    }

    .card-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .card-address {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      background: #f7f7f5;
      border-radius: 8px;
      padding: 9px 12px;
    }
    .field-label { font-size: 11px; color: #999; margin-bottom: 3px; }
    .field-value { font-size: 14px; font-weight: 500; color: #1a1a1a; }

    /* Highlight the DA field */
    .field-da {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
    }
    .field-da .field-label { color: #0050b3; }
    .field-da .field-value { color: #002766; font-weight: 700; }

    .unit-badge {
      display: none;
      margin-top: 10px;
      background: #E6F1FB;
      color: #0C447C;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .hint {
      margin-top: 1rem;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#378ADD"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </svg>
    NS Civic Address Finder
  </h1>
  <p class="subtitle">Search any Nova Scotia civic address by number, street, or community</p>

  <div class="source-pill">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#378ADD"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <ellipse cx="12" cy="5" rx="9" ry="3"/>
      <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
      <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
    </svg>
    Live · data.novascotia.ca
  </div>

  <div class="search-wrap">
    <input
      id="q"
      type="text"
      placeholder="Type civic number, street name, or community…"
      autocomplete="off"
      aria-label="Address search"
      aria-autocomplete="list"
      aria-controls="dropdown"
    />
    <div class="spinner" id="spinner"></div>
    <div id="dropdown" role="listbox" aria-label="Address suggestions"></div>
  </div>

  <div id="result-card" aria-live="polite">
    <p class="card-label">Selected address</p>
    <p class="card-address" id="res-full"></p>
    <div class="fields-grid">
      <!-- DA Field added here -->
      <div class="field field-da"><p class="field-label">Dissemination Area (DA)</p><p class="field-value" id="res-da">—</p></div>
      <div class="field"><p class="field-label">Civic number</p><p class="field-value" id="res-num">—</p></div>
      <div class="field"><p class="field-label">Street</p><p class="field-value" id="res-street">—</p></div>
      <div class="field"><p class="field-label">Community</p><p class="field-value" id="res-comm">—</p></div>
      <div class="field"><p class="field-label">Municipality</p><p class="field-value" id="res-mun">—</p></div>
      <div class="field"><p class="field-label">Coordinates</p><p class="field-value" id="res-ll">—</p></div>
    </div>
    <span class="unit-badge" id="res-unit"></span>
  </div>

  <p class="hint">Try "1308", "Spring Garden Rd", or "Dartmouth"</p>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const API_BASE    = 'https://data.novascotia.ca/resource/tntn-er5g.json';
  const DEBOUNCE_MS = 350;
  const RESULT_LIMIT = 10;
  
  // URL to your raw GitHub GeoJSON
  const DA_GEOJSON_URL = 'https://raw.githubusercontent.com/saeed-saffari/CPHSC/main/stories/Patient/Data/ns_da_2016.geojson';

  // ── State ─────────────────────────────────────────────────────────────────
  let debounceTimer  = null;
  let activeIndex    = -1;
  let currentResults = [];
  
  let daGeoJSON      = null; // Stores the GeoJSON map data once downloaded
  let isFetchingDA   = false;

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const input      = document.getElementById('q');
  const dropdown   = document.getElementById('dropdown');
  const spinner    = document.getElementById('spinner');
  const resultCard = document.getElementById('result-card');

  // ── DA Fetcher ────────────────────────────────────────────────────────────
  async function getGeoJSON() {
    if (daGeoJSON) return daGeoJSON; // Return if already loaded
    
    // If it's already in the process of downloading, wait for it
    if (isFetchingDA) {
      while(isFetchingDA) await new Promise(r => setTimeout(r, 100));
      return daGeoJSON;
    }
    
    isFetchingDA = true;
    try {
      const res = await fetch(DA_GEOJSON_URL);
      daGeoJSON = await res.json();
    } catch (err) {
      console.error("Failed to fetch DA map data:", err);
    } finally {
      isFetchingDA = false;
    }
    return daGeoJSON;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function formatStreet(r) {
    return [
      r.civicnum, r.civsuffix || '',
      r.unit_num  ? `Unit ${r.unit_num}` : '',
      r.strprefix || '', r.strname || '', r.strsuffix || '', r.strdir || '',
    ].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
  }

  function formatFull(r) {
    return [formatStreet(r), r.comm, r.mun, 'Nova Scotia'].filter(Boolean).join(', ');
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildUrl(raw) {
    const q = raw.trim();
    if (!q) return null;

    let where;
    if (/^\d/.test(q)) {
      const [num, ...rest] = q.split(/\s+/);
      if (rest.length === 0) {
        where = `civicnum='${num}'`;
      } else {
        const street = rest.join(' ').replace(/'/g, "''");
        where = `civicnum='${num}' AND upper(strname) like upper('%${street}%')`;
      }
    } else {
      const esc = q.replace(/'/g, "''");
      where = `upper(strname) like upper('%${esc}%') OR upper(comm) like upper('%${esc}%')`;
    }

    const params = new URLSearchParams({
      $where: where, $limit: RESULT_LIMIT, $order: 'strname,civicnum',
    });
    return `${API_BASE}?${params.toString()}`;
  }

  // ── API call ──────────────────────────────────────────────────────────────
  async function fetchAddresses(raw) {
    const url = buildUrl(raw);
    if (!url) { hideDropdown(); return; }
    spinner.style.display = 'block';

    try {
      const res  = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      currentResults = data;
      renderDropdown(data);
    } catch (err) {
      currentResults = [];
      dropdown.innerHTML = `<div class="dd-message">⚠️ Could not reach data.novascotia.ca</div>`;
      dropdown.style.display = 'block';
    } finally {
      spinner.style.display = 'none';
    }
  }

  // ── Dropdown render ───────────────────────────────────────────────────────
  function renderDropdown(rows) {
    activeIndex = -1;
    if (!rows.length) {
      dropdown.innerHTML = '<div class="dd-message">No results found in NSCAF</div>';
      dropdown.style.display = 'block';
      return;
    }

    const PIN_SVG = `<svg class="dd-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`;

    dropdown.innerHTML = rows.map((r, i) => {
      const main = formatStreet(r);
      const sub  = [r.comm, r.mun, r.county].filter(Boolean).join(' · ');
      return `<div class="dd-item" data-index="${i}" role="option" tabindex="-1">${PIN_SVG}<div><div class="dd-main">${escapeHtml(main)}</div><div class="dd-sub">${escapeHtml(sub)}</div></div></div>`;
    }).join('');

    dropdown.style.display = 'block';
    dropdown.querySelectorAll('.dd-item').forEach(el => {
      el.addEventListener('click', () => selectResult(+el.dataset.index));
    });
  }

  function hideDropdown() {
    dropdown.style.display = 'none';
    activeIndex = -1;
  }

  // ── Select a result & Find DA ─────────────────────────────────────────────
  async function selectResult(index) {
    const r = currentResults[index];
    if (!r) return;

    input.value = formatStreet(r);
    hideDropdown();

    // Populate basic address UI
    document.getElementById('res-full').textContent   = formatFull(r);
    document.getElementById('res-num').textContent    = (r.civicnum || '') + (r.civsuffix || '') || '—';
    document.getElementById('res-street').textContent = [r.strprefix, r.strname, r.strsuffix, r.strdir].filter(Boolean).join(' ') || '—';
    document.getElementById('res-comm').textContent   = r.comm   || '—';
    document.getElementById('res-mun').textContent    = r.mun    || '—';
    document.getElementById('res-da').textContent     = 'Loading DA map...'; // Initial state

    const lat = parseFloat(r.lat), lon = parseFloat(r.long);
    document.getElementById('res-ll').textContent =
      (!isNaN(lat) && !isNaN(lon)) ? `${lat.toFixed(5)}, ${lon.toFixed(5)}` : '—';

    const unitEl = document.getElementById('res-unit');
    if (r.unit_num) { unitEl.textContent = `Unit ${r.unit_num}`; unitEl.style.display = 'inline-block'; } 
    else { unitEl.style.display = 'none'; }

    resultCard.style.display = 'block';

    // -- SPATIAL CALCULATION (Point in Polygon via Turf.js) --
    if (!isNaN(lat) && !isNaN(lon)) {
      const geo = await getGeoJSON();
      
      if (geo) {
        // Turf.js uses [longitude, latitude] arrays
        const point = turf.point([lon, lat]);
        let foundDAUID = null;

        document.getElementById('res-da').textContent = 'Searching...';

        // Loop through all Dissemination Areas to find which polygon contains the point
        for (let i = 0; i < geo.features.length; i++) {
          const feature = geo.features[i];
          if (turf.booleanPointInPolygon(point, feature)) {
             // StatCan files typically use "DAUID" or "dauid" 
             foundDAUID = feature.properties.DAUID || feature.properties.dauid || "Match found, but DAUID property is missing";
             break;
          }
        }

        if (foundDAUID) {
          document.getElementById('res-da').textContent = foundDAUID;
        } else {
          document.getElementById('res-da').textContent = 'Outside bounds / No match';
        }
      } else {
        document.getElementById('res-da').textContent = 'Failed to load DA file';
      }
    } else {
       document.getElementById('res-da').textContent = 'Missing coordinates';
    }
  }

  // ── Keyboard navigation ───────────────────────────────────────────────────
  function updateActiveItem() {
    const items = dropdown.querySelectorAll('.dd-item');
    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    if (activeIndex >= 0) items[activeIndex].scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('keydown', e => {
    const items = dropdown.querySelectorAll('.dd-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIndex = Math.min(activeIndex + 1, items.length - 1); updateActiveItem(); } 
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); updateActiveItem(); } 
    else if (e.key === 'Enter') { if (activeIndex >= 0) { e.preventDefault(); selectResult(activeIndex); } } 
    else if (e.key === 'Escape') { hideDropdown(); }
  });

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const val = input.value.trim();
    if (!val) { hideDropdown(); return; }
    debounceTimer = setTimeout(() => fetchAddresses(val), DEBOUNCE_MS);
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) hideDropdown();
  });
</script>

</body>
</html>
