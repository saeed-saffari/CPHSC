<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can-EQI Environmental Dashboard</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #1a9850;
      --bg-color: #f8f9fa;
      --sidebar-width: 440px; /* Wider to fit table columns */
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: #333;
      background-color: var(--bg-color);
    }

    /* ---- Layout ---- */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #fff;
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      z-index: 1001;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--primary-color);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span {
      font-weight: 400;
      color: #6b7280;
      font-size: 0.95rem;
    }

    #main-content {
      display: flex;
      flex: 1;
      overflow: hidden; 
    }

    /* ---- Map Area ---- */
    #map {
      flex: 1;
      height: 100%;
      background: #ddd;
    }

    /* ---- Sidebar ---- */
    #sidebar {
      width: var(--sidebar-width);
      background: #fff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      box-shadow: -2px 0 10px rgba(0,0,0,0.05);
      z-index: 1000;
    }

    .sidebar-section {
      padding: 15px 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .sidebar-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* ---- Controls ---- */
    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      font-weight: 500;
    }

    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background-color: #fff;
      font-size: 0.9rem;
      color: #374151;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(26, 152, 80, 0.1);
    }

    /* ---- Charts ---- */
    #radar-container {
      position: relative;
      height: 320px; /* Adjusted height */
      width: 100%;
      margin-top: 10px;
    }

    /* ---- Table Styles ---- */
    .rank-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .rank-table th {
      text-align: left;
      color: #6b7280;
      font-weight: 600;
      padding: 6px 4px;
      border-bottom: 2px solid #e5e7eb;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .rank-table td {
      padding: 6px 4px;
      border-bottom: 1px solid #f3f4f6;
      color: #374151;
      vertical-align: middle;
    }

    .rank-table tr:last-child td {
      border-bottom: none;
    }

    .score-cell {
      font-family: 'Inter', monospace;
      font-weight: 500;
      color: #111;
    }

    .rank-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.75rem;
      min-width: 20px;
      text-align: center;
    }

    /* ---- Legend (Compact) ---- */
    .legend {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 12px; 
      border-radius: 6px;
      box-shadow: var(--shadow);
      font-size: 11px;
      line-height: 1.4;
      color: #374151;
      border: 1px solid #e5e7eb;
      min-width: 200px;
    }

    .legend h4 {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 600;
      color: #111;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    .legend-gradient {
      height: 12px;
      width: 100%;
      border-radius: 3px;
      margin: 6px 0 3px 0;
      border: 1px solid rgba(0,0,0,0.1);
    }
    
    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: #6b7280;
      font-weight: 500;
      font-size: 10px;
    }
    
    .eqi-bar {
      display: flex;
      width: 100%;
      height: 12px;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.1);
      margin: 6px 0 3px 0;
    }
    .eqi-segment { flex: 1; height: 100%; }
  </style>
</head>

<body>

<div id="app-container">
  
  <header>
    <h1>Can-EQI <span>Environmental Quality Index Map</span></h1>
  </header>

  <div id="main-content">
    
    <div id="map"></div>

    <div id="sidebar">
      
      <!-- Controls Section -->
      <div class="sidebar-section">
        <div class="sidebar-title">Settings</div>
        
        <div class="control-group">
          <label for="citySelect">Select City</label>
          <select id="citySelect">
            <option value="montreal">Montreal</option>
            <option value="abbotsford">Abbotsford</option>
            <option value="barrie">Barrie</option>
            <option value="calgary">Calgary</option>
            <option value="chicoutimi">Chicoutimi</option>
            <option value="edmonton">Edmonton</option>
            <option value="gatineau">Gatineau</option>
            <option value="guelph">Guelph</option>
            <option value="halifax">Halifax</option>
            <option value="hamilton">Hamilton</option>
            <option value="kelowna">Kelowna</option>
            <option value="kingston">Kingston</option>
            <option value="kitchener">Kitchener</option>
            <option value="london">London</option>
            <option value="milton">Milton</option>
            <option value="moncton">Moncton</option>
            <option value="oshawa">Oshawa</option>
            <option value="ottawa">Ottawa</option>
            <option value="quebec">Quebec</option>
            <option value="regina">Regina</option>
            <option value="saskatoon">Saskatoon</option>
            <option value="sherbrooke">Sherbrooke</option>
            <option value="st_catharines">St. Catharines</option>
            <option value="st_johns">St. John's</option>
            <option value="toronto">Toronto</option>
            <option value="trois_rivieres">Trois Rivieres</option>
            <option value="vancouver">Vancouver</option>
            <option value="victoria">Victoria</option>
            <option value="windsor">Windsor</option>
            <option value="winnipeg">Winnipeg</option>
          </select>
        </div>

        <div class="control-group">
          <label for="varSelect">Select Variable</label>
          <select id="varSelect">
            <option value="EQI_city">Environmental Quality Index (EQI)</option>
            <option disabled>──────────────</option>
            <option value="pm25_q_city">PM2.5 (ug/m3)</option>
            <option value="no2_q_city">NO2 (ppb)</option>
            <option value="ndvi_q_city">Greenness (NDVI)</option>
            <option value="wtr_ds_q_city">Bluespace (Dist. to Water)</option>
            <option value="rd_lng_q_city">Length of Roads</option>
            <option value="near_pp_q_city">Dist. to Power Plants</option>
            <option value="m_d_d_q_city">UV Radiation (J/m2)</option>
            <option value="d_h_tm_q_city">Heat wave diff (°C)</option>
            <option value="d_c_tm_q_city">Cold wave diff (°C)</option>
          </select>
        </div>
      </div>

      <!-- Rankings Table Section -->
      <div class="sidebar-section">
        <div class="sidebar-title">City Scores & Rankings</div>
        <table class="rank-table">
          <thead>
            <tr>
              <th width="45%">Variable</th>
              <th width="25%">Score (1-10)</th>
              <th width="30%">Rank</th>
            </tr>
          </thead>
          <tbody id="rankTableBody">
            <tr><td colspan="3">Loading rankings...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Radar Chart Section -->
      <div class="sidebar-section" style="border-bottom:none;">
        <div class="sidebar-title">City Profile</div>
        <div id="radar-container">
          <canvas id="radarChart"></canvas>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* -----------------------------------------------------
   MAP INITIALIZATION
   ----------------------------------------------------- */
const map = L.map("map", { zoomControl: false }).setView([45.5, -73.6], 10);
L.control.zoom({ position: 'topleft' }).addTo(map);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
	attribution: 'Tiles &copy; Esri'
}).addTo(map);

let geoLayer;

/* -----------------------------------------------------
   COLOR LOGIC
   ----------------------------------------------------- */
function interpolateColor(color1, color2, factor) {
  const result = color1.match(/\w\w/g).map((c, i) => {
    const v1 = parseInt(c, 16);
    const v2 = parseInt(color2.match(/\w\w/g)[i], 16);
    const val = Math.round(v1 + factor * (v2 - v1));
    return val.toString(16).padStart(2, "0");
  });
  return "#" + result.join("");
}

function scaleQ(v) {
  if (v === null || v === undefined) return 0;
  return Math.max(0, Math.min(1, (v - 1) / 9));
}

function colorEQI(v) {
  if (v === null || v === undefined) return "#ccc";
  if (v <= 20) return "#b2182b";
  if (v <= 30) return "#d6604d";
  if (v <= 40) return "#f4a582";
  if (v <= 50) return "#fddbc7";
  if (v <= 60) return "#e6f598";
  if (v <= 70) return "#abdda4";
  if (v <= 80) return "#66c2a5";
  if (v <= 90) return "#1a9850";
  return "#006837";
}

function colorAir(v)    { return interpolateColor("#8c2d04", "#ffffb2", scaleQ(v)); }
function colorGreen(v)  { return interpolateColor("#e5f5e0", "#006d2c", scaleQ(v)); }
function colorBlue(v)   { return interpolateColor("#deebf7", "#08519c", scaleQ(v)); }
function colorPurple(v) { return interpolateColor("#efedf5", "#54278f", scaleQ(v)); }
function colorOrange(v) { return interpolateColor("#fff7bc", "#d94801", scaleQ(v)); }
function colorRed(v)    { return interpolateColor("#a50f15", "#fee5d9", scaleQ(v)); }
function colorCold(v)   { return interpolateColor("#08519c", "#eff3ff", scaleQ(v)); }
function colorRoad(v) {
  if (v === null || v === undefined) return "#eee";
  return interpolateColor("#f6e8c3", "#8c510a", scaleQ(v));
}

function getColor(variable, value) {
  if (variable === "EQI_city") return colorEQI(value);
  if (variable === "pm25_q_city" || variable === "no2_q_city") return colorAir(value);
  if (variable === "ndvi_q_city") return colorGreen(value);
  if (variable === "wtr_ds_q_city") return colorBlue(value);
  if (variable === "near_pp_q_city") return colorPurple(value);
  if (variable === "m_d_d_q_city") return colorOrange(value);
  if (variable === "d_h_tm_q_city") return colorRed(value);
  if (variable === "d_c_tm_q_city") return colorCold(value);
  if (variable === "rd_lng_q_city") return colorRoad(value);
  return "#ccc";
}

/* -----------------------------------------------------
   LEGEND LOGIC
   ----------------------------------------------------- */
const legend = L.control({ position: "bottomright" });
legend.onAdd = function () { return L.DomUtil.create("div", "legend"); };
legend.addTo(map);

function updateLegend(variable) {
  const div = legend.getContainer();
  div.innerHTML = "<h4>Legend</h4>";

  let label = "", gradient = "", minLabel = "", maxLabel = "";

  if (variable === "EQI_city") {
    div.innerHTML += `<div style="margin-bottom:4px"><em>EQI (Deciles)</em></div>`;
    const colors = ["#b2182b", "#d6604d", "#f4a582", "#fddbc7", "#e6f598", "#abdda4", "#66c2a5", "#1a9850", "#006837"];
    let barHtml = '<div class="eqi-bar">';
    colors.forEach(c => { barHtml += `<div class="eqi-segment" style="background:${c}"></div>`; });
    barHtml += '</div>';
    div.innerHTML += barHtml;
    div.innerHTML += `<div class="legend-labels"><span>Low (0)</span><span>High (100)</span></div>`;
    return;
  }
  else if (variable === "pm25_q_city" || variable === "no2_q_city") {
    label = "Air pollution (1 to 10)"; gradient = "linear-gradient(to right, #8c2d04, #ffffb2)"; minLabel = "Low Q"; maxLabel = "High Q";
  }
  else if (variable === "ndvi_q_city") {
    label = "Greenness (1 to 10)"; gradient = "linear-gradient(to right, #e5f5e0, #006d2c)"; minLabel = "Less"; maxLabel = "More";
  }
  else if (variable === "wtr_ds_q_city") {
    label = "Bluespace (1 to 10)"; gradient = "linear-gradient(to right, #deebf7, #08519c)"; minLabel = "Low"; maxLabel = "High";
  }
  else if (variable === "near_pp_q_city") {
    label = "Dist. to power (1 to 10)"; gradient = "linear-gradient(to right, #efedf5, #54278f)"; minLabel = "1"; maxLabel = "10";
  }
  else if (variable === "m_d_d_q_city") {
    label = "UV radiation (1 to 10)"; gradient = "linear-gradient(to right, #fff7bc, #d94801)"; minLabel = "1"; maxLabel = "10";
  }
  else if (variable === "d_h_tm_q_city") {
    label = "Heat wave diff (1 to 10)"; gradient = "linear-gradient(to right, #a50f15, #fee5d9)"; minLabel = "1"; maxLabel = "10";
  }
  else if (variable === "d_c_tm_q_city") {
    label = "Cold wave diff (1 to 10)"; gradient = "linear-gradient(to right, #08519c, #eff3ff)"; minLabel = "1"; maxLabel = "10";
  }
  else if (variable === "rd_lng_q_city") {
    label = "Length of roads (1 to 10)"; gradient = "linear-gradient(to right, #f6e8c3, #8c510a)"; minLabel = "1"; maxLabel = "10";
  }

  div.innerHTML += `
    <div style="margin-bottom:4px"><em>${label}</em></div>
    <div class="legend-gradient" style="background: ${gradient};"></div>
    <div class="legend-labels"><span>${minLabel}</span><span>${maxLabel}</span></div>
  `;
}

/* -----------------------------------------------------
   DATA HANDLING
   ----------------------------------------------------- */

// Data storage
let cityRadarData = {}; // Scores (JSON)
let cityRankData = {};  // Ranks (CSV)

// Configuration for mapping Score Keys (JSON) and Rank Keys (CSV)
// These keys must match your JSON file and CSV file headers exactly.
const dataMapping = [
  { label: "EQI",               scoreKey: "EQI",                        rankKey: "EQI_rank" },
  { label: "PM2.5",             scoreKey: "PM2.5 (ug/m3)",              rankKey: "pm25_q_rank" },
  { label: "NO2",               scoreKey: "NO2 (ppb)",                  rankKey: "no2_q_rank" },
  { label: "Greenness (NDVI)",  scoreKey: "Greenness (NDVI)",           rankKey: "ndvi_q_rank" },
  { label: "Bluespace",         scoreKey: "Bluespace (Distance to Water)", rankKey: "wtr_ds_q_rank" },
  { label: "Dist. Power Plants",scoreKey: "Distance to Power Plants (m)", rankKey: "near_pp_q_rank" },
  { label: "Road Length",       scoreKey: "Length of Roads",            rankKey: "rd_lng_q_rank" },
  { label: "UV Radiation",      scoreKey: "Annual Average UV Radiation (J/m2)", rankKey: "m_d_d_q_rank" },
  { label: "Heat Wave Diff",    scoreKey: "Difference during heat wave (°C)", rankKey: "d_h_tm_q_rank" },
  { label: "Cold Wave Diff",    scoreKey: "Difference during cold wave (°C)", rankKey: "d_c_tm_q_rank" }
];

// Helper: Normalize names to match dropdown values (e.g. "St. John's" -> "st_johns")
function normalizeCityName(name) {
  if (!name) return "";
  return name.toLowerCase()
             .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Remove accents
             .replace(/\./g, "")      // Remove dots
             .replace(/'/g, "")       // Remove apostrophes
             .replace(/-/g, "_")      // Dash to underscore
             .replace(/\s+/g, "_");   // Space to underscore
}

// 1. Load SCORES (JSON) & Initialize Radar
fetch("city_profiles.json")
  .then(r => r.json())
  .then(data => {
    cityRadarData = data;
    // Initialize Radar immediately after JSON loads (don't wait for CSV)
    initRadar(document.getElementById("citySelect").value);
    updateTable(document.getElementById("citySelect").value); // Update table (scores only first)
  })
  .catch(err => console.error("Error loading city_profiles.json:", err));

// 2. Load RANKS (CSV) & Update Table
Papa.parse("EQI_city_rankinig_with_rank.csv", {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    results.data.forEach(row => {
      // Assuming first column is City Name if 'City' or 'city' header not found
      let name = row.City || row.city; 
      if (!name) {
         // Fallback: use the first value in the row object
         const keys = Object.keys(row);
         if (keys.length > 0) name = row[keys[0]];
      }
      
      const key = normalizeCityName(name);
      if (key) {
        cityRankData[key] = row;
      }
    });
    // Update table again now that ranks are loaded
    updateTable(document.getElementById("citySelect").value);
  },
  error: function(err) {
    console.error("Error loading CSV:", err);
  }
});

/* -----------------------------------------------------
   UI UPDATES
   ----------------------------------------------------- */

function updateTable(city) {
  const tbody = document.getElementById("rankTableBody");
  tbody.innerHTML = "";

  const scores = cityRadarData[city] || {};
  const ranks = cityRankData[city] || {};

  dataMapping.forEach(item => {
    const tr = document.createElement("tr");

    // Get Score
    let score = scores[item.scoreKey];
    if (typeof score === 'number') score = score.toFixed(2);
    else score = "-";

    // Get Rank
    let rank = ranks[item.rankKey];
    if (!rank) rank = "-";

    tr.innerHTML = `
      <td>${item.label}</td>
      <td class="score-cell">${score}</td>
      <td><span class="rank-badge">#${rank}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

// Radar Chart Init
let radarChart = null;

function initRadar(city) {
  const ctx = document.getElementById("radarChart");
  if (!ctx) return;

  // Keys for Chart Mapping (Scores)
  const radarKeys = dataMapping.slice(1).map(d => d.scoreKey); // Skip EQI, take rest
  const radarLabels = dataMapping.slice(1).map(d => {
     // Split long labels for chart
     return d.label.split(" "); 
  });

  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.color = "#666";

  radarChart = new Chart(ctx, {
    type: "radar",
    data: {
      labels: radarLabels,
      datasets: [{
        label: "Score (1-10)",
        data: radarKeys.map(k => cityRadarData[city] ? cityRadarData[city][k] : 0),
        borderColor: "#1a9850",
        backgroundColor: "rgba(26,152,80,0.2)",
        pointBackgroundColor: "#1a9850",
        pointBorderColor: "#fff",
        borderWidth: 2,
        pointRadius: 3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: 5 },
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { stepSize: 2, backdropColor: 'transparent', font: { size: 10 } },
          grid: { color: '#e5e7eb' },
          angleLines: { color: '#e5e7eb' },
          pointLabels: { font: { size: 10, weight: '500' }, color: '#374151' }
        }
      }
    }
  });
}

function updateRadar(city) {
  if (!radarChart || !cityRadarData[city]) return;
  // Use same keys as initRadar
  const radarKeys = dataMapping.slice(1).map(d => d.scoreKey);
  radarChart.data.datasets[0].data = radarKeys.map(k => cityRadarData[city][k]);
  radarChart.update();
}

/* -----------------------------------------------------
   GEOJSON LOADING
   ----------------------------------------------------- */

function loadCity(city, variable) {
  if (geoLayer) map.removeLayer(geoLayer);

  fetch(`geojson_cities_w_rd/${city}_da.geojson`)
    .then(r => r.json())
    .then(data => {
      geoLayer = L.geoJSON(data, {
        style: f => ({
          fillColor: getColor(variable, f.properties[variable]),
          weight: 0.8, color: "#fff", opacity: 0.6, fillOpacity: 0.75
        }),
        onEachFeature: (f, layer) => {
          let value = f.properties[variable];
          if (typeof value === 'number') value = value.toFixed(2);
          
          layer.bindTooltip(`
            <div style="font-family:Inter,sans-serif;">
              <strong>DAUID:</strong> ${f.properties.DAUID}<br>
              <strong>Val:</strong> ${value}
            </div>
          `, { sticky: true });
          
          layer.on({
            mouseover: (e) => {
              const l = e.target;
              l.setStyle({ weight: 2, color: '#333', fillOpacity: 0.9 });
              l.bringToFront();
            },
            mouseout: (e) => {
              geoLayer.resetStyle(e.target);
            }
          });
        }
      }).addTo(map);

      map.fitBounds(geoLayer.getBounds());
      updateLegend(variable);
    })
    .catch(err => {
      console.error("Error loading geojson:", err);
    });
}

// Event Listeners
const citySelect = document.getElementById("citySelect");
const varSelect = document.getElementById("varSelect");

citySelect.onchange = () => {
  const city = citySelect.value;
  loadCity(city, varSelect.value);
  updateRadar(city);
  updateTable(city);
};

varSelect.onchange = () => {
  loadCity(citySelect.value, varSelect.value);
};

// Initial Load
loadCity("montreal", "EQI_city");

</script>
</body>
</html>
